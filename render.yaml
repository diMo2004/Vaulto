services:
  # -------------------------------------------------------------
  # 1. Spring Boot Backend
  # -------------------------------------------------------------
  - type: web
    name: vaulto-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATA_MONGODB_URI
        sync: false # Set in Render Dashboard (MongoDB Atlas connection string)
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false # Set in Render Dashboard
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set in Render Dashboard
      - key: GOOGLE_REDIRECT_URI
        value: https://vaulto-backend.onrender.com/login/oauth2/code/google
      - key: GOOGLE_SUCCESS_REDIRECT
        value: https://vaulto-woad.vercel.app/dashboard
      - key: GOOGLE_FAILURE_REDIRECT
        value: https://vaulto-woad.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://vaulto-woad.vercel.app,http://localhost:3000,http://localhost:5173
      - key: COOKIE_DOMAIN
        value: .onrender.com
      - key: OCR_SERVICE_URL
        value: https://vaulto-ocr.onrender.com/predict
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false

  # -------------------------------------------------------------
  # 2. OCR Microservice (Tesseract - 512MB RAM compatible)
  # -------------------------------------------------------------
  - type: web
    name: vaulto-ocr
    runtime: docker
    dockerfilePath: ./paddleocr-service/Dockerfile
    dockerContext: ./paddleocr-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000

  # -------------------------------------------------------------
  # 3. Recommendation Microservice (FastAPI + Neon PostgreSQL)
  # -------------------------------------------------------------
  - type: web
    name: vaulto-recommendation
    runtime: docker
    dockerfilePath: ./recommendation-service/Dockerfile
    dockerContext: ./recommendation-service
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard (Neon PostgreSQL connection string)
