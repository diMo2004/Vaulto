server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGO_URI:${MONGODB_URI:mongodb://localhost:27017/coupons_auth}}}

# JWT Properties
app.jwt.access-secret=${JWT_ACCESS_SECRET:change_this_access_secret_to_something_very_secure}
app.jwt.refresh-secret=${JWT_REFRESH_SECRET:change_this_refresh_secret_to_something_very_secure}
app.jwt.access-expiration=900000
app.jwt.refresh-expiration=2592000000

# OAuth2 Properties
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}

# File upload limits (Spring's default is 1MB, too small for phone screenshots)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# OCR Service URL
app.ocr.service-url=${OCR_SERVICE_URL:http://localhost:8081/predict}

# Recommendation Service URL
# Recommendation Service URL
app.recommendation.service-url=${RECOMMENDATION_SERVICE_URL:https://vaulto-recommendation.onrender.com}

# Custom App Properties
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,https://vaulto-woad.vercel.app}
# COOKIE_DOMAIN intentionally left blank — .onrender.com is on the Public Suffix List;
# browsers reject cookies set for that domain. Leave empty to use the host's own domain.app.cookie.domain=${COOKIE_DOMAIN:}
app.oauth2.success-redirect=${GOOGLE_SUCCESS_REDIRECT:https://vaulto-woad.vercel.app/dashboard}
app.oauth2.failure-redirect=${GOOGLE_FAILURE_REDIRECT:https://vaulto-woad.vercel.app}

# Twilio Properties
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:your_twilio_account_sid}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:your_twilio_auth_token}
app.twilio.from-number=${TWILIO_FROM_NUMBER:your_twilio_from_number}
